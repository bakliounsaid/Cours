<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2F5D50">
    <title>Éducœur</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: #FAF6EE;
            color: #1F2A2E;
            font-family: Nunito, ui-sans-serif, system-ui, sans-serif;
        }
        html[lang="ar"] body { font-family: Cairo, ui-sans-serif, system-ui, sans-serif; }
        main { max-width: 420px; text-align: center; }
        img { width: 96px; height: 96px; }
        h1 { margin: 20px 0 8px; color: #2F5D50; font-size: 24px; }
        p { margin: 0; color: #4F625C; line-height: 1.5; }
        button {
            margin-top: 24px;
            border: 0;
            border-radius: 9999px;
            padding: 12px 24px;
            background: #B9572F;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        [data-lang] { display: none; }
    </style>
</head>
<body>
    <main>
        <img src="/images/pwa/icon-192.png" alt="" width="96" height="96">
        <!-- Une seule langue affichée : la dernière utilisée dans l'application (sinon le français) -->
        <div data-lang="fr">
            <h1>Vous êtes hors connexion</h1>
            <p>La page s’affichera dès que le réseau sera revenu.</p>
            <button type="button" onclick="location.reload()">Réessayer</button>
        </div>
        <div data-lang="ar">
            <h1>أنت غير متصل بالإنترنت</h1>
            <p>ستظهر الصفحة فور عودة الشبكة.</p>
            <button type="button" onclick="location.reload()">إعادة المحاولة</button>
        </div>
        <div data-lang="en">
            <h1>You are offline</h1>
            <p>The page will load as soon as the network is back.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </div>
    </main>
    <script>
        let lang = 'fr';
        try {
            lang = ['fr', 'ar', 'en'].includes(localStorage.getItem('educoeur-locale')) ? localStorage.getItem('educoeur-locale') : 'fr';
        } catch (error) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.querySelector(`[data-lang="${lang}"]`).style.display = 'block';
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
